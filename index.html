<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DentalPro — Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-page">
  <!-- Hero lateral -->
  <div class="login-hero">
    <div>
      <div class="login-hero-logo">🦷 Dentista</div>
      <div class="login-hero-subtitle">Sistema de gestión dental</div>
    </div>
    <div>
      <h1 class="login-hero-headline">Gestiona tu consultorio con precisión</h1>
      <p class="login-hero-desc">Pacientes, citas, pagos y más — todo en un solo lugar, seguro y accesible.</p>
    </div>
  </div>

  <!-- Formulario -->
  <div class="login-form-panel">
    <div class="login-form-box">
      <h2>Bienvenido</h2>
      <p>Ingresa tus credenciales para continuar</p>

      <div id="error-msg" style="display:none; background:#fdf0ef; color:#c0392b; padding:12px 14px; border-radius:8px; font-size:.875rem; margin-bottom:20px; border-left:3px solid #c0392b;"></div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary btn-full btn-lg" id="login-btn" onclick="handleLogin()">
        Iniciar sesión
      </button>

      <p style="text-align:center; margin-top:24px; font-size:.85rem; color:var(--text-muted);">
        ¿Sin cuenta? Solicita acceso a tu dentista.
      </p>
    </div>
  </div>
</div>

<script type="module">
  import { Auth, App } from './js/app.js';

  // Verificar si ya hay sesión activa
  App.init();

  window.handleLogin = async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const errDiv = document.getElementById('error-msg');

    if (!email || !password) {
      showError('Por favor ingresa tu correo y contraseña.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Verificando...';
    errDiv.style.display = 'none';

    try {
      await Auth.signIn(email, password);
      // La redirección ocurre automáticamente via onAuthStateChange en App.init()
    } catch (err) {
      showError('Credenciales incorrectas. Intenta de nuevo.');
      btn.disabled = false;
      btn.textContent = 'Iniciar sesión';
    }
  };

  function showError(msg) {
    const errDiv = document.getElementById('error-msg');
    errDiv.textContent = msg;
    errDiv.style.display = 'block';
  }

  // Enter key submit
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.handleLogin();
  });
</script>

</body>
</html>
