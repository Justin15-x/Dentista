<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dentista Palacios — Panel del Dentista</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="dashboard">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-name">🦷 Dentista Palacios</div>
      <div class="sidebar-logo-sub">Panel del dentista</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">Principal</div>
      <button class="nav-item active" onclick="showSection('dashboard')" data-section="dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        Inicio
      </button>
      <button class="nav-item" onclick="showSection('patients')" data-section="patients">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        Pacientes
      </button>
      <button class="nav-item" onclick="showSection('calendar')" data-section="calendar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
        Calendario
      </button>
      <button class="nav-item" onclick="showSection('appointments')" data-section="appointments">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
        Citas
      </button>
      <button class="nav-item" onclick="showSection('payments')" data-section="payments">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        Pagos
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="user-avatar">D</div>
        <div>
          <div class="sidebar-user-name" id="user-name">Cargando...</div>
          <div class="sidebar-user-role">Dentista</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-full" style="margin-top:8px" onclick="handleLogout()">Cerrar sesión</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title" id="page-title">Inicio</div>
      <div id="topbar-actions"></div>
    </header>

    <div class="page-content" id="page-content">
      <div class="loading-spinner"><div class="spinner"></div><p>Cargando...</p></div>
    </div>
  </main>
</div>

<!-- MODALES (se insertan dinámicamente) -->
<div id="modal-container"></div>

<script type="module">
import { Auth, App, Utils } from '../js/app.js';
import { Patients } from '../js/modules/patients.js';
import { Appointments } from '../js/modules/appointments.js';
import { Payments } from '../js/modules/payments.js';

let currentUser = null;
let allPatients = [];
let allAppointments = [];
let calendarDate = new Date();

// ============================================================
// INIT
// ============================================================
async function init() {
  currentUser = await Auth.getCurrentUser();
  if (!currentUser || currentUser.role !== 'dentist') {
    window.location.href = '../index.html';
    return;
  }

  document.getElementById('user-name').textContent = currentUser.full_name;
  document.getElementById('user-avatar').textContent = currentUser.full_name.charAt(0).toUpperCase();

  await showSection('dashboard');
}

// ============================================================
// NAVIGATION
// ============================================================
window.showSection = async function(section) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.querySelector(`[data-section="${section}"]`).classList.add('active');

  const content = document.getElementById('page-content');
  const title = document.getElementById('page-title');
  const actions = document.getElementById('topbar-actions');
  actions.innerHTML = '';

  switch(section) {
    case 'dashboard':    title.textContent = 'Inicio';     await renderDashboard(content); break;
    case 'patients':     title.textContent = 'Pacientes';  await renderPatients(content, actions); break;
    case 'calendar':     title.textContent = 'Calendario'; await renderCalendar(content, actions); break;
    case 'appointments': title.textContent = 'Citas';      await renderAppointments(content, actions); break;
    case 'payments':     title.textContent = 'Pagos';      await renderPayments(content, actions); break;
  }
};

// ============================================================
// DASHBOARD HOME
// ============================================================
async function renderDashboard(el) {
  Utils.showLoading(el);
  try {
    const [patients, appointments] = await Promise.all([
      Patients.getAll(),
      Appointments.getAll()
    ]);
    allPatients = patients;
    allAppointments = appointments;

    const today = new Date().toDateString();
    const todayAppts = appointments.filter(a => new Date(a.appointment_date).toDateString() === today);
    const upcoming = appointments.filter(a => new Date(a.appointment_date) > new Date() && a.status === 'scheduled');

    el.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card stat-card--primary">
          <div class="stat-card-label">Total pacientes</div>
          <div class="stat-card-value">${patients.length}</div>
        </div>
        <div class="stat-card stat-card--accent">
          <div class="stat-card-label">Citas hoy</div>
          <div class="stat-card-value">${todayAppts.length}</div>
        </div>
        <div class="stat-card stat-card--success">
          <div class="stat-card-label">Próximas citas</div>
          <div class="stat-card-value">${upcoming.length}</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Citas de hoy</div>
        </div>
        ${todayAppts.length === 0 ? '<div class="empty-state"><p>No hay citas programadas para hoy</p></div>' : `
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Hora</th><th>Paciente</th><th>Tratamiento</th><th>Estado</th></tr></thead>
            <tbody>${todayAppts.map(a => `
              <tr>
                <td><strong>${new Date(a.appointment_date).toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit'})}</strong></td>
                <td>${a.patients?.full_name || '—'}</td>
                <td>${a.title}</td>
                <td><span class="badge badge-${a.status}">${statusLabel(a.status)}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`}
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Pacientes recientes</div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Nombre</th><th>Teléfono</th><th>Fecha registro</th></tr></thead>
            <tbody>${patients.slice(0,5).map(p => `
              <tr>
                <td><strong>${p.full_name}</strong></td>
                <td>${p.phone || '—'}</td>
                <td>${Utils.formatDate(p.created_at)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>Error al cargar datos: ${e.message}</p></div>`;
  }
}

// ============================================================
// PATIENTS
// ============================================================
async function renderPatients(el, actions) {
  Utils.showLoading(el);
  actions.innerHTML = `<button class="btn btn-primary" onclick="openPatientModal()">+ Nuevo paciente</button>`;

  try {
    allPatients = await Patients.getAll();
    renderPatientsTable(el, allPatients);
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

function renderPatientsTable(el, patients) {
  if (patients.length === 0) {
    el.innerHTML = `<div class="empty-state"><h3>Sin pacientes</h3><p>Crea tu primer paciente para comenzar</p><button class="btn btn-primary" onclick="openPatientModal()">+ Nuevo paciente</button></div>`;
    return;
  }

  el.innerHTML = `
    <div class="search-bar">
      <div class="search-input-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" placeholder="Buscar paciente..." oninput="filterPatients(this.value)" />
      </div>
    </div>
    <div class="table-wrapper">
      <table id="patients-table">
        <thead><tr><th>Nombre</th><th>Teléfono</th><th>Email</th><th>Notas médicas</th><th>Acciones</th></tr></thead>
        <tbody>
          ${patients.map(p => `
            <tr>
              <td><strong>${p.full_name}</strong></td>
              <td>${p.phone || '—'}</td>
              <td>${p.email || '—'}</td>
              <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.medical_notes || '—'}</td>
              <td>
                <div class="table-actions">
                  <button class="btn btn-sm btn-secondary" onclick="viewPatientDetail('${p.id}')">Ver</button>
                  <button class="btn btn-sm btn-ghost" onclick="openPatientModal('${p.id}')">Editar</button>
                  <button class="btn btn-sm btn-danger" onclick="deletePatient('${p.id}','${p.full_name}')">Eliminar</button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

window.filterPatients = function(query) {
  const filtered = allPatients.filter(p =>
    p.full_name.toLowerCase().includes(query.toLowerCase()) ||
    (p.email && p.email.toLowerCase().includes(query.toLowerCase())) ||
    (p.phone && p.phone.includes(query))
  );
  const tbody = document.querySelector('#patients-table tbody');
  if (tbody) tbody.innerHTML = filtered.map(p => `
    <tr>
      <td><strong>${p.full_name}</strong></td>
      <td>${p.phone||'—'}</td>
      <td>${p.email||'—'}</td>
      <td>${p.medical_notes||'—'}</td>
      <td>
        <div class="table-actions">
          <button class="btn btn-sm btn-secondary" onclick="viewPatientDetail('${p.id}')">Ver</button>
          <button class="btn btn-sm btn-ghost" onclick="openPatientModal('${p.id}')">Editar</button>
          <button class="btn btn-sm btn-danger" onclick="deletePatient('${p.id}','${p.full_name}')">Eliminar</button>
        </div>
      </td>
    </tr>`).join('');
};

window.openPatientModal = async function(id = null) {
  let patient = {};
  if (id) {
    try { patient = await Patients.getById(id); } catch(e) {}
  }

  showModal(`
    <div class="modal-header">
      <div class="modal-title">${id ? 'Editar paciente' : 'Nuevo paciente'}</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Nombre completo *</label>
          <input type="text" id="p-name" value="${patient.full_name||''}" placeholder="Ana García" />
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="p-phone" value="${patient.phone||''}" placeholder="449-123-4567" />
        </div>
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="p-email" value="${patient.email||''}" placeholder="ana@correo.com" />
      </div>
      <div class="form-group">
        <label>Dirección</label>
        <input type="text" id="p-address" value="${patient.address||''}" />
      </div>
      <div class="form-group">
        <label>Notas médicas</label>
        <textarea id="p-notes" placeholder="Alergias, condiciones especiales...">${patient.medical_notes||''}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="savePatient('${id||''}')">Guardar</button>
    </div>
  `);
};

window.savePatient = async function(id) {
  const data = {
    full_name: document.getElementById('p-name').value.trim(),
    phone: document.getElementById('p-phone').value.trim(),
    email: document.getElementById('p-email').value.trim(),
    address: document.getElementById('p-address').value.trim(),
    medical_notes: document.getElementById('p-notes').value.trim()
  };

  if (!data.full_name) { Utils.showToast('El nombre es requerido', 'error'); return; }

  try {
    if (id) { await Patients.update(id, data); } else { await Patients.create(data); }
    closeModal();
    Utils.showToast(id ? 'Paciente actualizado' : 'Paciente creado');
    await showSection('patients');
  } catch(e) {
    Utils.showToast('Error al guardar: ' + e.message, 'error');
  }
};

window.deletePatient = async function(id, name) {
  if (!Utils.confirmDelete(name)) return;
  try {
    await Patients.delete(id);
    Utils.showToast('Paciente eliminado');
    await showSection('patients');
  } catch(e) {
    Utils.showToast('Error al eliminar', 'error');
  }
};

window.viewPatientDetail = async function(id) {
  try {
    const [patient, financial] = await Promise.all([
      Patients.getById(id),
      Patients.getFinancialSummary(id)
    ]);

    showModal(`
      <div class="modal-header">
        <div class="modal-title">${patient.full_name}</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="finance-summary">
          <div>
            <div class="finance-item-label">Costo total</div>
            <div class="finance-item-value">${Utils.formatCurrency(financial?.total_cost)}</div>
          </div>
          <div>
            <div class="finance-item-label">Pagado</div>
            <div class="finance-item-value paid">${Utils.formatCurrency(financial?.total_paid)}</div>
          </div>
          <div>
            <div class="finance-item-label">Saldo pendiente</div>
            <div class="finance-item-value due">${Utils.formatCurrency(financial?.balance_due)}</div>
          </div>
        </div>

        <div style="margin-bottom:16px">
          <strong>📞</strong> ${patient.phone||'—'} &nbsp;&nbsp;
          <strong>✉️</strong> ${patient.email||'—'}
        </div>

        <div class="card-title" style="margin-bottom:10px">Citas</div>
        ${(patient.appointments||[]).length === 0 ? '<p style="color:var(--text-muted)">Sin citas</p>' :
          patient.appointments.map(a => `
            <div style="padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-weight:600">${a.title}</div>
                <div style="font-size:.8rem;color:var(--text-muted)">${Utils.formatDateTime(a.appointment_date)}</div>
              </div>
              <div style="text-align:right">
                <div>${Utils.formatCurrency(a.base_cost)}</div>
                <span class="badge badge-${a.status}">${statusLabel(a.status)}</span>
              </div>
            </div>`).join('')}

        <div style="margin-top:16px;display:flex;gap:8px">
          <button class="btn btn-secondary" onclick="closeModal();openAppointmentModal(null,'${id}')">+ Nueva cita</button>
          <button class="btn btn-accent" onclick="closeModal();openPaymentModal('${id}')">+ Registrar pago</button>
        </div>
      </div>
    `, 'large');
  } catch(e) {
    Utils.showToast('Error al cargar paciente', 'error');
  }
};

// ============================================================
// CALENDAR
// ============================================================
async function renderCalendar(el, actions) {
  Utils.showLoading(el);
  actions.innerHTML = `<button class="btn btn-primary" onclick="openAppointmentModal()">+ Nueva cita</button>`;

  try {
    allAppointments = await Appointments.getAll();
    renderCalendarView(el);
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

function renderCalendarView(el) {
  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDay = firstDay.getDay();

  const monthName = calendarDate.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
  const days = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

  const apptsByDay = {};
  allAppointments.forEach(a => {
    const key = new Date(a.appointment_date).toDateString();
    if (!apptsByDay[key]) apptsByDay[key] = [];
    apptsByDay[key].push(a);
  });

  let cells = '';
  for (let i = 0; i < startDay; i++) {
    const prevDay = new Date(year, month, -startDay + i + 1);
    cells += `<div class="calendar-day other-month"><div class="day-number">${prevDay.getDate()}</div></div>`;
  }

  const today = new Date().toDateString();
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(year, month, d);
    const key = date.toDateString();
    const appts = apptsByDay[key] || [];
    const isToday = key === today;

    cells += `<div class="calendar-day${isToday?' today':''}" onclick="openDayView('${key}')">
      <div class="day-number">${d}</div>
      ${appts.slice(0,3).map(a => `
        <div class="calendar-event status-${a.status}" onclick="event.stopPropagation();openAppointmentModal('${a.id}')" title="${a.patients?.full_name} - ${a.title}">
          ${new Date(a.appointment_date).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})} ${a.patients?.full_name?.split(' ')[0]||''}
        </div>`).join('')}
      ${appts.length > 3 ? `<div style="font-size:.7rem;color:var(--text-muted)">+${appts.length-3} más</div>` : ''}
    </div>`;
  }

  el.innerHTML = `
    <div class="calendar-nav">
      <button class="btn btn-ghost btn-sm" onclick="changeMonth(-1)">← Anterior</button>
      <div class="calendar-month-title">${monthName.charAt(0).toUpperCase() + monthName.slice(1)}</div>
      <button class="btn btn-ghost btn-sm" onclick="changeMonth(1)">Siguiente →</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="calendar-grid">
        ${days.map(d => `<div class="calendar-day-header">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
  `;
}

window.changeMonth = function(dir) {
  calendarDate.setMonth(calendarDate.getMonth() + dir);
  renderCalendarView(document.getElementById('page-content'));
};

window.openDayView = function(dateStr) {
  const appts = allAppointments.filter(a => new Date(a.appointment_date).toDateString() === dateStr);
  if (appts.length === 0) return;

  showModal(`
    <div class="modal-header">
      <div class="modal-title">${new Date(dateStr).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      ${appts.map(a => `
        <div style="padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <div style="font-weight:600">${a.title}</div>
              <div style="font-size:.85rem;color:var(--text-muted)">${a.patients?.full_name||''} · ${new Date(a.appointment_date).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</div>
              ${a.description ? `<div style="font-size:.85rem;margin-top:4px">${a.description}</div>` : ''}
            </div>
            <div style="text-align:right">
              <div style="font-weight:600">${Utils.formatCurrency(Appointments.calculateTotalCost(a))}</div>
              <span class="badge badge-${a.status}">${statusLabel(a.status)}</span>
            </div>
          </div>
          <div style="margin-top:10px;display:flex;gap:6px">
            <button class="btn btn-sm btn-secondary" onclick="closeModal();openAppointmentModal('${a.id}')">Editar</button>
            <button class="btn btn-sm btn-danger" onclick="deleteAppointment('${a.id}')">Eliminar</button>
          </div>
        </div>`).join('')}
    </div>
  `);
};

// ============================================================
// APPOINTMENTS
// ============================================================
async function renderAppointments(el, actions) {
  Utils.showLoading(el);
  actions.innerHTML = `<button class="btn btn-primary" onclick="openAppointmentModal()">+ Nueva cita</button>`;

  try {
    allAppointments = await Appointments.getAll();
    allPatients = await Patients.getAll();

    el.innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Fecha</th><th>Paciente</th><th>Tratamiento</th><th>Costo</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody>
            ${allAppointments.map(a => `
              <tr>
                <td>${Utils.formatDateTime(a.appointment_date)}</td>
                <td><strong>${a.patients?.full_name||'—'}</strong></td>
                <td>${a.title}</td>
                <td>${Utils.formatCurrency(Appointments.calculateTotalCost(a))}</td>
                <td><span class="badge badge-${a.status}">${statusLabel(a.status)}</span></td>
                <td>
                  <div class="table-actions">
                    <button class="btn btn-sm btn-ghost" onclick="openAppointmentModal('${a.id}')">Editar</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteAppointment('${a.id}')">Eliminar</button>
                  </div>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

window.openAppointmentModal = async function(id = null, preselectedPatientId = null) {
  let appt = {};
  let treatments = [];
  if (id) {
    try {
      appt = await Appointments.getById(id);
      treatments = appt.appointment_treatments || [];
    } catch(e) {}
  }

  const patients = allPatients.length > 0 ? allPatients : await Patients.getAll();
  const dateVal = appt.appointment_date ? new Date(appt.appointment_date).toISOString().slice(0,16) : '';

  showModal(`
    <div class="modal-header">
      <div class="modal-title">${id ? 'Editar cita' : 'Nueva cita'}</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Paciente *</label>
        <select id="a-patient">
          <option value="">Seleccionar paciente...</option>
          ${patients.map(p => `<option value="${p.id}" ${(appt.patient_id||preselectedPatientId)===p.id?'selected':''}>${p.full_name}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>Título del tratamiento *</label>
        <input type="text" id="a-title" value="${appt.title||''}" placeholder="Limpieza dental, extracción..." />
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea id="a-desc" placeholder="Detalles adicionales...">${appt.description||''}</textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Fecha y hora *</label>
          <input type="datetime-local" id="a-date" value="${dateVal}" />
        </div>
        <div class="form-group">
          <label>Duración (minutos)</label>
          <input type="number" id="a-duration" value="${appt.duration_minutes||60}" min="15" step="15" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Costo base (MXN)</label>
          <input type="number" id="a-cost" value="${appt.base_cost||0}" min="0" step="50" />
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="a-status">
            <option value="scheduled" ${appt.status==='scheduled'?'selected':''}>Programada</option>
            <option value="completed" ${appt.status==='completed'?'selected':''}>Completada</option>
            <option value="cancelled" ${appt.status==='cancelled'?'selected':''}>Cancelada</option>
            <option value="no_show" ${appt.status==='no_show'?'selected':''}>No asistió</option>
          </select>
        </div>
      </div>

      ${id ? `
      <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:8px">
        <div style="font-weight:600;margin-bottom:10px">Tratamientos adicionales</div>
        <div id="treatments-list">
          ${treatments.map(t => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
              <span>${t.description}</span>
              <div style="display:flex;gap:8px;align-items:center">
                <span style="font-weight:600;color:${parseFloat(t.amount)>=0?'var(--success)':'var(--danger)'}">${Utils.formatCurrency(t.amount)}</span>
                <button class="btn btn-sm btn-danger" onclick="removeTreatment('${t.id}','${id}')">✕</button>
              </div>
            </div>`).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <input type="text" id="t-desc" placeholder="Descripción del tratamiento" style="flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:6px;font-family:var(--font-body)" />
          <input type="number" id="t-amount" placeholder="Monto" step="50" style="width:100px;padding:8px 12px;border:1.5px solid var(--border);border-radius:6px;font-family:var(--font-body)" />
          <button class="btn btn-secondary btn-sm" onclick="addTreatmentInline('${id}')">+ Agregar</button>
        </div>
        <p style="font-size:.75rem;color:var(--text-muted);margin-top:6px">Valores negativos = descuentos</p>
      </div>` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveAppointment('${id||''}')">Guardar</button>
    </div>
  `);
};

window.addTreatmentInline = async function(appointmentId) {
  const desc = document.getElementById('t-desc').value.trim();
  const amount = parseFloat(document.getElementById('t-amount').value);
  if (!desc || isNaN(amount)) { Utils.showToast('Completa descripción y monto', 'warning'); return; }

  try {
    const t = await Appointments.addTreatment(appointmentId, { description: desc, amount });
    const list = document.getElementById('treatments-list');
    list.insertAdjacentHTML('beforeend', `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
        <span>${t.description}</span>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-weight:600;color:${t.amount>=0?'var(--success)':'var(--danger)'}">${Utils.formatCurrency(t.amount)}</span>
          <button class="btn btn-sm btn-danger" onclick="removeTreatment('${t.id}','${appointmentId}')">✕</button>
        </div>
      </div>`);
    document.getElementById('t-desc').value = '';
    document.getElementById('t-amount').value = '';
    Utils.showToast('Tratamiento agregado');
  } catch(e) { Utils.showToast('Error: ' + e.message, 'error'); }
};

window.removeTreatment = async function(treatmentId, appointmentId) {
  try {
    await Appointments.deleteTreatment(treatmentId);
    await openAppointmentModal(appointmentId);
  } catch(e) { Utils.showToast('Error al eliminar', 'error'); }
};

window.saveAppointment = async function(id) {
  const data = {
    patient_id: document.getElementById('a-patient').value,
    title: document.getElementById('a-title').value.trim(),
    description: document.getElementById('a-desc').value.trim(),
    appointment_date: document.getElementById('a-date').value,
    duration_minutes: parseInt(document.getElementById('a-duration').value) || 60,
    base_cost: parseFloat(document.getElementById('a-cost').value) || 0,
    status: document.getElementById('a-status').value
  };

  if (!data.patient_id || !data.title || !data.appointment_date) {
    Utils.showToast('Completa los campos requeridos', 'error');
    return;
  }

  try {
    if (id) { await Appointments.update(id, data); } else { await Appointments.create(data); }
    closeModal();
    Utils.showToast(id ? 'Cita actualizada' : 'Cita creada');
    await showSection('appointments');
  } catch(e) { Utils.showToast('Error: ' + e.message, 'error'); }
};

window.deleteAppointment = async function(id) {
  if (!confirm('¿Eliminar esta cita?')) return;
  try {
    await Appointments.delete(id);
    Utils.showToast('Cita eliminada');
    closeModal();
    await showSection('appointments');
  } catch(e) { Utils.showToast('Error al eliminar', 'error'); }
};

// ============================================================
// PAYMENTS
// ============================================================
async function renderPayments(el, actions) {
  Utils.showLoading(el);
  actions.innerHTML = `<button class="btn btn-primary" onclick="openPaymentModal()">+ Registrar pago</button>`;

  try {
    const [payments, patients] = await Promise.all([
      Payments.getAll(),
      Patients.getAll()
    ]);
    allPatients = patients;

    const totalCollected = payments.reduce((s, p) => s + parseFloat(p.amount), 0);

    el.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card stat-card--success">
          <div class="stat-card-label">Total cobrado</div>
          <div class="stat-card-value">${Utils.formatCurrency(totalCollected)}</div>
        </div>
        <div class="stat-card stat-card--accent">
          <div class="stat-card-label">Pagos registrados</div>
          <div class="stat-card-value">${payments.length}</div>
        </div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Fecha</th><th>Paciente</th><th>Cita</th><th>Monto</th><th>Método</th><th>Notas</th><th>Acciones</th></tr></thead>
          <tbody>
            ${payments.map(p => `
              <tr>
                <td>${Utils.formatDate(p.payment_date)}</td>
                <td><strong>${p.patients?.full_name||'—'}</strong></td>
                <td>${p.appointments?.title||'—'}</td>
                <td style="color:var(--success);font-weight:600">${Utils.formatCurrency(p.amount)}</td>
                <td>${methodLabel(p.payment_method)}</td>
                <td>${p.notes||'—'}</td>
                <td><button class="btn btn-sm btn-danger" onclick="deletePayment('${p.id}')">Eliminar</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

window.openPaymentModal = async function(preselectedPatientId = null) {
  const patients = allPatients.length > 0 ? allPatients : await Patients.getAll();
  const appointments = allAppointments.length > 0 ? allAppointments : await Appointments.getAll();

  showModal(`
    <div class="modal-header">
      <div class="modal-title">Registrar pago</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Paciente *</label>
        <select id="pay-patient" onchange="updateAppointmentSelect()">
          <option value="">Seleccionar paciente...</option>
          ${patients.map(p => `<option value="${p.id}" ${preselectedPatientId===p.id?'selected':''}>${p.full_name}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>Cita relacionada</label>
        <select id="pay-appointment">
          <option value="">Sin cita específica</option>
          ${appointments.map(a => `<option value="${a.id}" data-patient="${a.patient_id}">${a.title} - ${Utils.formatDate(a.appointment_date)}</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Monto (MXN) *</label>
          <input type="number" id="pay-amount" min="0" step="50" placeholder="0.00" />
        </div>
        <div class="form-group">
          <label>Método de pago</label>
          <select id="pay-method">
            <option value="cash">Efectivo</option>
            <option value="card">Tarjeta</option>
            <option value="transfer">Transferencia</option>
            <option value="other">Otro</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Fecha del pago</label>
        <input type="date" id="pay-date" value="${new Date().toISOString().slice(0,10)}" />
      </div>
      <div class="form-group">
        <label>Notas</label>
        <input type="text" id="pay-notes" placeholder="Referencia, observaciones..." />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="savePayment()">Registrar pago</button>
    </div>
  `);

  if (preselectedPatientId) updateAppointmentSelect();
};

window.updateAppointmentSelect = function() {
  const patientId = document.getElementById('pay-patient').value;
  const sel = document.getElementById('pay-appointment');
  Array.from(sel.options).forEach(opt => {
    opt.style.display = (!patientId || opt.dataset.patient === patientId || opt.value === '') ? '' : 'none';
  });
};

window.savePayment = async function() {
  const data = {
    patient_id: document.getElementById('pay-patient').value,
    appointment_id: document.getElementById('pay-appointment').value || null,
    amount: parseFloat(document.getElementById('pay-amount').value),
    payment_method: document.getElementById('pay-method').value,
    payment_date: document.getElementById('pay-date').value || new Date().toISOString(),
    notes: document.getElementById('pay-notes').value.trim()
  };

  if (!data.patient_id || !data.amount || data.amount <= 0) {
    Utils.showToast('Selecciona paciente y monto válido', 'error');
    return;
  }

  try {
    await Payments.create(data);
    closeModal();
    Utils.showToast('Pago registrado correctamente');
    await showSection('payments');
  } catch(e) { Utils.showToast('Error: ' + e.message, 'error'); }
};

window.deletePayment = async function(id) {
  if (!confirm('¿Eliminar este pago?')) return;
  try {
    await Payments.delete(id);
    Utils.showToast('Pago eliminado');
    await showSection('payments');
  } catch(e) { Utils.showToast('Error al eliminar', 'error'); }
};

// ============================================================
// MODAL HELPERS
// ============================================================
function showModal(html, size = '') {
  const container = document.getElementById('modal-container');
  container.innerHTML = `
    <div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
      <div class="modal${size==='large'?' modal--large':''}">${html}</div>
    </div>`;
  requestAnimationFrame(() => document.getElementById('modal-overlay').classList.add('open'));
}

window.closeModal = function() {
  const overlay = document.getElementById('modal-overlay');
  if (overlay) {
    overlay.classList.remove('open');
    setTimeout(() => overlay.remove(), 250);
  }
};

window.handleOverlayClick = function(e) {
  if (e.target.id === 'modal-overlay') closeModal();
};

// ============================================================
// HELPERS
// ============================================================
function statusLabel(s) {
  const map = { scheduled:'Programada', completed:'Completada', cancelled:'Cancelada', no_show:'No asistió' };
  return map[s] || s;
}

function methodLabel(m) {
  const map = { cash:'Efectivo', card:'Tarjeta', transfer:'Transferencia', other:'Otro' };
  return map[m] || m;
}

window.handleLogout = async function() {
  await Auth.signOut();
  window.location.href = '../index.html';
};

// Start
init();
</script>
