<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DentalPro — Mi Portal</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:var(--bg)">

<div style="max-width:720px;margin:0 auto;padding:24px 20px 60px">

  <!-- Header -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:32px">
    <div>
      <div style="font-family:var(--font-display);font-size:1.1rem;font-weight:600;color:var(--primary)">🦷 DentalPro</div>
      <div style="font-size:.8rem;color:var(--text-muted)">Portal del paciente</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Cerrar sesión</button>
  </div>

  <div id="portal-content">
    <div class="loading-spinner"><div class="spinner"></div><p>Cargando tu información...</p></div>
  </div>

</div>

<script type="module">
import { Auth } from '../js/app.js';
import { Patients } from '../js/modules/patients.js';
import { Utils } from '../js/app.js';

async function init() {
  const user = await Auth.getCurrentUser();
  if (!user || user.role !== 'patient') {
    window.location.href = '../index.html';
    return;
  }

  try {
    const patient = await Patients.getOwnRecord();
    renderPortal(patient, user);
  } catch(e) {
    document.getElementById('portal-content').innerHTML = `
      <div class="empty-state">
        <h3>Información no disponible</h3>
        <p>Tu dentista aún no ha vinculado tu cuenta a un expediente. Comunícate con tu consultorio.</p>
      </div>`;
  }
}

function renderPortal(patient, user) {
  const appointments = patient.appointments || [];
  const payments = patient.payments || [];

  // Calcular financiero
  const totalCost = appointments
    .filter(a => a.status !== 'cancelled')
    .reduce((sum, a) => {
      const base = parseFloat(a.base_cost) || 0;
      const extras = (a.appointment_treatments || []).reduce((s, t) => s + parseFloat(t.amount), 0);
      return sum + base + extras;
    }, 0);
  const totalPaid = payments.reduce((s, p) => s + parseFloat(p.amount), 0);
  const balance = totalCost - totalPaid;

  // Próxima cita
  const now = new Date();
  const upcoming = appointments
    .filter(a => a.status === 'scheduled' && new Date(a.appointment_date) > now)
    .sort((a, b) => new Date(a.appointment_date) - new Date(b.appointment_date));
  const nextAppt = upcoming[0] || null;

  const el = document.getElementById('portal-content');
  el.innerHTML = `
    <!-- Bienvenida -->
    <div class="patient-welcome">Hola, ${patient.full_name.split(' ')[0]} 👋</div>
    <p style="color:var(--text-secondary);margin-bottom:24px">Aquí puedes consultar tu información dental</p>

    <!-- Próxima cita -->
    ${nextAppt ? `
    <div class="next-appointment-card">
      <div class="nac-label">📅 Tu próxima cita</div>
      <div class="nac-date">${Utils.formatDateTime(nextAppt.appointment_date)}</div>
      <div class="nac-treatment">${nextAppt.title}</div>
      ${nextAppt.description ? `<div style="opacity:.7;font-size:.875rem;margin-top:4px">${nextAppt.description}</div>` : ''}
    </div>` : `
    <div class="card" style="text-align:center;padding:28px">
      <p style="color:var(--text-secondary)">No tienes citas próximas programadas</p>
    </div>`}

    <!-- Resumen financiero -->
    <div class="card" style="margin-top:20px">
      <div class="card-header">
        <div class="card-title">💰 Resumen financiero</div>
      </div>
      <div class="finance-summary">
        <div>
          <div class="finance-item-label">Costo total</div>
          <div class="finance-item-value">${Utils.formatCurrency(totalCost)}</div>
        </div>
        <div>
          <div class="finance-item-label">Has pagado</div>
          <div class="finance-item-value paid">${Utils.formatCurrency(totalPaid)}</div>
        </div>
        <div>
          <div class="finance-item-label">Saldo pendiente</div>
          <div class="finance-item-value ${balance > 0 ? 'due' : ''}">${Utils.formatCurrency(Math.max(0, balance))}</div>
        </div>
      </div>
    </div>

    <!-- Historial de citas -->
    <div class="card" style="margin-top:20px">
      <div class="card-header">
        <div class="card-title">🗓 Historial de citas</div>
      </div>
      ${appointments.length === 0 ? '<div class="empty-state" style="padding:24px"><p>No hay citas registradas</p></div>' :
      appointments
        .sort((a, b) => new Date(b.appointment_date) - new Date(a.appointment_date))
        .map(a => {
          const apptCost = (parseFloat(a.base_cost)||0) + (a.appointment_treatments||[]).reduce((s,t) => s+parseFloat(t.amount), 0);
          return `
          <div style="padding:14px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <div style="font-weight:600">${a.title}</div>
              <div style="font-size:.85rem;color:var(--text-muted)">${Utils.formatDateTime(a.appointment_date)}</div>
              ${a.description ? `<div style="font-size:.85rem;margin-top:2px">${a.description}</div>` : ''}
            </div>
            <div style="text-align:right;flex-shrink:0;margin-left:16px">
              <div style="font-weight:600">${Utils.formatCurrency(apptCost)}</div>
              <span class="badge badge-${a.status}">${statusLabel(a.status)}</span>
            </div>
          </div>`;
        }).join('')}
    </div>

    <!-- Pagos realizados -->
    <div class="card" style="margin-top:20px">
      <div class="card-header">
        <div class="card-title">✅ Pagos realizados</div>
      </div>
      ${payments.length === 0 ? '<div class="empty-state" style="padding:24px"><p>No hay pagos registrados</p></div>' :
      payments
        .sort((a, b) => new Date(b.payment_date) - new Date(a.payment_date))
        .map(p => `
          <div style="padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-weight:500">${Utils.formatDate(p.payment_date)}</div>
              <div style="font-size:.8rem;color:var(--text-muted)">${methodLabel(p.payment_method)}</div>
            </div>
            <div style="font-weight:700;color:var(--success)">${Utils.formatCurrency(p.amount)}</div>
          </div>`).join('')}
    </div>
  `;
}

function statusLabel(s) {
  const map = { scheduled:'Programada', completed:'Completada', cancelled:'Cancelada', no_show:'No asistió' };
  return map[s] || s;
}

function methodLabel(m) {
  const map = { cash:'Efectivo', card:'Tarjeta', transfer:'Transferencia', other:'Otro' };
  return map[m] || m;
}

window.handleLogout = async function() {
  await Auth.signOut();
  window.location.href = '../index.html';
};

init();
</script>

</body>
</html>
